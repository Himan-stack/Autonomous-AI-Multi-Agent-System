services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autonomous-backend
    env_file:
      - .env
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
    restart: unless-stopped
    # No "ports:" — not published to the host. Only Caddy talks to this
    # container (over the internal compose network), so the backend is
    # never exposed directly to the public browser.
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autonomous-frontend
    restart: unless-stopped
    # Same-origin production build (VITE_API_BASE_URL unset -> ''),
    # served by nginx inside the image. Not published to the host either
    # — Caddy is the only public entrypoint.
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    container_name: autonomous-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:
